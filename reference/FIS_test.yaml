openapi: 3.0.3
info:
  title: Description Rendering Test API
  version: 1.0.0
  description: >
    Small test spec to check how different endpoint description formats render
    in ReadMe.
servers:
  - url: https://example.com
paths:
  /plain-markdown-table:
    get:
      summary: Plain Markdown table
      description: |
        This endpoint uses a simple markdown table.

        | Column A | Column B | Column C |
        | :--- | :--- | :--- |
        | test | test | test |
        | test | test | test |

        End of description.
      responses:
        '200':
          description: OK
  /markdown-table-with-br:
    get:
      summary: Markdown table with br tags
      description: |
        **Description**  
        *Version 1*  

        This endpoint mixes markdown and HTML breaks.

        <br />

        | Column A | Column B | Column C |
        | :--- | :--- | :--- |
        | test | test | test |
        | test | test | test |

        <br />

        Text after the table.
      responses:
        '200':
          description: OK
  /inline-html-breaks:
    get:
      summary: Inline HTML breaks only
      description: |
        **Description** <br>
        *Version 1* <br>
        This endpoint uses inline HTML breaks only.<br>
        Another line here.<br />
        Final line here.
      responses:
        '200':
          description: OK
  /mixed-legacy-style:
    get:
      summary: Mixed legacy style
      description: |
        **Description**  <br>
        *Version 1*  <br>
        This endpoint tries a more fragile mixed format.<br>
        The table below should help test parser behavior.  <br />

        | S.No | Name | Notes |
        | :--- | :--- | :--- |
        | 1 | test | normal row |
        | 2 | test | row after mixed html |

        <br />

        Another paragraph after the table.
      responses:
        '200':
          description: OK
  /raw-pipes-no-table:
    get:
      summary: Raw pipes without valid table structure
      description: >
        This endpoint has pipe characters but should not necessarily become a
        proper table.


        | test | test | test |

        | test | test | test |


        There is no proper separator row above.
      responses:
        '200':
          description: OK
  /list-plus-table:
    get:
      summary: List plus table
      description: |
        This endpoint includes a list before the table.

        - Item one
        - Item two
        - Item three

        | Column A | Column B | Column C |
        | :--- | :--- | :--- |
        | test | test | test |
        | test | test | test |

        Done.
      responses:
        '200':
          description: OK
components: {}
