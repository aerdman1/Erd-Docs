openapi: 3.1.0
info:
  title: Orbit API
  version: 1.4.0
  summary: 在可重复使用火箭上预订货运空间、追踪有效载荷并实时传输遥测数据。
  description: >
    Erdman Industries 的 **Orbit API**
    让您可以查找即将进行的发射任务、预订有效载荷舱位、上传货物清单，并全程追踪您的有效载荷直至进入轨道。


    > 📘 Orbit 和 Erdman Industries 均为虚构

    >

    > 此 API 旨在展示 ReadMe 的功能。**Sandbox** 服务器会回显您的请求，因此 **Try It!** 始终可用。
  contact:
    name: Orbit Developer Relations
    url: https://erdman.readme.io/discuss
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://httpbin.org/anything/orbit/v1
    description: Sandbox（回显您的请求）
  - url: https://api.{region}.orbit.erdman.example/v1
    description: 生产环境
    variables:
      region:
        default: us-east
        enum:
          - us-east
          - eu-central
          - ap-south
        description: 距离您的系统最近的发射区域。
security:
  - OrbitKey: []
  - OAuth2:
      - bookings:read
      - bookings:write
      - telemetry:read
tags:
  - name: Launches
    description: 已安排的发射任务及其剩余货运运力。
  - name: Bookings
    description: 预订、更改和取消发射任务中的有效载荷舱位。
  - name: Payloads
    description: 全程追踪已预订的有效载荷从发射台到达目标轨道。
  - name: Account
    description: 您的 Orbit 账户的使用量、配额和套餐限制。
x-readme:
  explorer-enabled: true
  proxy-enabled: true
  samples-languages:
    - shell
    - node
    - python
    - go
    - ruby
paths:
  /launches:
    get:
      operationId: listLaunches
      summary: 列出发射任务
      description: |
        返回即将进行的发射任务，按时间从近到远排序。按状态、运载火箭或发射窗口进行筛选，
        以找到具有足够载运量容纳您有效载荷的舱位。
      tags:
        - Launches
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: 仅返回处于此状态的发射任务。
          schema:
            $ref: '#/components/schemas/LaunchStatus'
        - name: vehicle
          in: query
          description: 仅返回使用此运载火箭的发射任务。
          schema:
            $ref: '#/components/schemas/Vehicle'
        - name: window_start
          in: query
          description: 要包含的最早发射窗口（ISO 8601）。
          schema:
            type: string
            format: date-time
            examples:
              - '2026-12-01T00:00:00Z'
        - name: min_capacity_kg
          in: query
          description: 仅返回剩余货运运力至少达到该数值的发射任务。
          schema:
            type: integer
            minimum: 1
            examples:
              - 250
      responses:
        '200':
          description: 一页发射任务列表。
          headers:
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - has_more
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Launch'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
              examples:
                upcoming:
                  summary: 两项即将进行的发射任务
                  value:
                    data:
                      - id: lch_7Hq2Zr
                        name: Starhopper 14
                        vehicle: kestrel-heavy
                        status: scheduled
                        window:
                          opens_at: '2026-12-03T14:05:00Z'
                          closes_at: '2026-12-03T16:05:00Z'
                        pad: LC-39X
                        capacity:
                          total_kg: 6400
                          available_kg: 1850
                        target_orbit: leo
                      - id: lch_9Kd4Mw
                        name: Polaris Run
                        vehicle: wren
                        status: go
                        window:
                          opens_at: '2026-12-09T03:30:00Z'
                          closes_at: '2026-12-09T04:00:00Z'
                        pad: SLC-7E
                        capacity:
                          total_kg: 900
                          available_kg: 120
                        target_orbit: sso
                    has_more: true
                    next_cursor: Y3Vyc29yOjI=
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-internal: false
  /launches/{launchId}:
    parameters:
      - $ref: '#/components/parameters/LaunchId'
    get:
      operationId: getLaunch
      summary: 获取发射任务
      description: 返回单次发射任务的信息，包括其天气预报和实时倒计时。
      tags:
        - Launches
      responses:
        '200':
          description: 发射任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Launch'
        '404':
          $ref: '#/components/responses/NotFound'
  /launches/{launchId}/weather:
    parameters:
      - $ref: '#/components/parameters/LaunchId'
    get:
      operationId: getLaunchWeather
      summary: 获取发射天气
      deprecated: true
      description: |
        **已弃用。** 请改为读取 [获取发射任务](getlaunch) 中的 `weather` 对象。
        此端点将于 2027-03-01 停止响应。
      tags:
        - Launches
      responses:
        '200':
          description: 发射窗口期的天气预报。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
  /bookings:
    get:
      operationId: listBookings
      summary: 列出预订
      description: 返回您的预订，按最新优先排序。
      tags:
        - Bookings
      security:
        - OrbitKey: []
        - OAuth2:
            - bookings:read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: 一页预订列表。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  has_more:
                    type: boolean
                  next_cursor:
                    type:
                      - string
                      - 'null'
    post:
      operationId: createBooking
      summary: 预订有效载荷舱位
      description: |
        预留发射任务的货运空间。预订初始状态为 `pending`，在 Orbit 审核您的清单后将变为
        `confirmed`。届时您将收到 `booking.confirmed` webhook 通知。

        请发送 `Idempotency-Key` 请求头，确保重试的请求绝不会重复预订。
      tags:
        - Bookings
      security:
        - OrbitKey: []
        - OAuth2:
            - bookings:write
      parameters:
        - name: Idempotency-Key
          in: header
          description: 用于确保重试安全的唯一值（可使用 UUID）。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              cubesat:
                summary: 前往太阳同步轨道的 3U CubeSat
                value:
                  launch_id: lch_9Kd4Mw
                  payload:
                    type: satellite
                    name: Pixel Owl 3U
                    mass_kg: 4
                    target_orbit: sso
                    deploy_altitude_km: 525
                  insurance: standard
                  notify_url: https://example.com/hooks/orbit
              bulk:
                summary: 运往空间站的大宗货物
                value:
                  launch_id: lch_7Hq2Zr
                  payload:
                    type: bulk_cargo
                    name: Hydroponics resupply
                    mass_kg: 820
                    pressurized: true
                    hazmat_class: none
                  insurance: premium
      responses:
        '201':
          description: 预订已创建，正在等待清单审核。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
              examples:
                pending:
                  value:
                    id: bkg_4Fh8Qp
                    launch_id: lch_9Kd4Mw
                    status: pending
                    payload:
                      type: satellite
                      name: Pixel Owl 3U
                      mass_kg: 4
                      target_orbit: sso
                      deploy_altitude_km: 525
                    price:
                      amount: 245000
                      currency: USD
                    created_at: '2026-11-17T15:02:11Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 该发射任务已无多余空间容纳此有效载荷。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://erdman.readme.io/docs/errors-and-rate-limits#launch-full
                title: Launch is full
                status: 409
                detail: Polaris Run has 120 kg free and this payload is 820 kg.
        '422':
          description: 此有效载荷无法通过该运载火箭送达其目标轨道。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://erdman.readme.io/docs/errors-and-rate-limits#delta-v-exceeded
                title: Delta-v budget exceeded
                status: 422
                detail: A wren can't lift 820 kg to GEO. Try a kestrel-heavy launch.
      x-internal: false
  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      operationId: getBooking
      summary: 获取预订
      tags:
        - Bookings
      responses:
        '200':
          description: 预订信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateBooking
      summary: 更新预订
      description: 更改保险级别或 webhook URL。若要更改有效载荷，需要创建新的预订。
      tags:
        - Bookings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                insurance:
                  $ref: '#/components/schemas/Insurance'
                notify_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: 更新后的预订信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
    delete:
      operationId: cancelBooking
      summary: 取消预订
      description: |
        取消预订。在窗口开启前 30 天以上取消无需支付任何费用。
        此后取消，Orbit 将扣留 25% 的费用。
      tags:
        - Bookings
      responses:
        '204':
          description: 预订已取消。
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{bookingId}/manifest:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      operationId: uploadManifest
      summary: 上传货物清单
      description: 附加已签署的货物清单（PDF 格式，最大 10 MB）。Orbit 将在一个工作日内完成审核。
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF 格式的已签署清单。
                signed_by:
                  type: string
                  description: 签署该清单的人员姓名。
      responses:
        '202':
          description: 清单已收到，正在排队等待审核。
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: string
                  review_status:
                    type: string
                    enum:
                      - queued
                      - in_review
                      - approved
                      - rejected
  /payloads/{payloadId}/telemetry:
    parameters:
      - name: payloadId
        in: path
        required: true
        schema:
          type: string
          examples:
            - pld_2Xc9Lb
    get:
      operationId: getTelemetry
      summary: 获取有效载荷遥测数据
      description: 返回飞行中有效载荷的遥测采样数据。
      tags:
        - Payloads
      security:
        - OrbitKey: []
        - OAuth2:
            - telemetry:read
      parameters:
        - name: interval
          in: query
          description: 各采样点之间的间隔。
          schema:
            type: string
            enum:
              - 1s
              - 10s
              - 1m
              - 5m
            default: 10s
        - name: from
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 遥测样本，最早的排在最前。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetrySample'
              example:
                - at: '2026-12-09T03:41:00Z'
                  altitude_km: 212.4
                  velocity_mps: 7466
                  temperature_c: -18.5
                  phase: ascent
                - at: '2026-12-09T03:41:10Z'
                  altitude_km: 219.9
                  velocity_mps: 7512
                  temperature_c: -19.1
                  phase: ascent
  /account/usage:
    get:
      operationId: getUsage
      summary: 获取账户用量
      description: 返回您已使用的每月配额量。
      tags:
        - Account
      responses:
        '200':
          description: 当前计费周期的用量。
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                    enum:
                      - hobby
                      - mission
                      - fleet
                  period_ends_at:
                    type: string
                    format: date-time
                  requests:
                    type: object
                    properties:
                      used:
                        type: integer
                      limit:
                        type: integer
                  kg_booked:
                    type: object
                    properties:
                      used:
                        type: integer
                      limit:
                        type: integer
webhooks:
  booking.confirmed:
    post:
      operationId: bookingConfirmed
      summary: 预订已确认
      description: 在 Orbit 批准舱单且预订最终确认时发送。
      tags:
        - Bookings
      parameters:
        - $ref: '#/components/parameters/OrbitSignature'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            example:
              id: evt_1Lr7Ns
              type: booking.confirmed
              created_at: '2026-11-18T09:12:44Z'
              data:
                booking_id: bkg_4Fh8Qp
                launch_id: lch_9Kd4Mw
                status: confirmed
      responses:
        '200':
          description: 返回任意 2xx 状态码以确认该事件。
  launch.status_changed:
    post:
      operationId: launchStatusChanged
      summary: 发射状态已变更
      description: 每当您已预订的发射任务状态发生变化（例如从 `go` 变为 `scrubbed`）时发送。
      tags:
        - Launches
      parameters:
        - $ref: '#/components/parameters/OrbitSignature'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
            example:
              id: evt_8Wq2Hd
              type: launch.status_changed
              created_at: '2026-12-09T03:12:00Z'
              data:
                launch_id: lch_9Kd4Mw
                from: go
                to: scrubbed
                reason: Upper-level winds
      responses:
        '200':
          description: 返回任意 2xx 状态码以确认该事件。
components:
  securitySchemes:
    OrbitKey:
      type: apiKey
      in: header
      name: X-Orbit-Key
      description: 来自 **账户 → API 密钥** 的私钥。它以 `ok_live_` 或 `ok_test_` 开头。
    OAuth2:
      type: oauth2
      description: 适用于代表团队执行操作的服务器到服务器集成。
      flows:
        clientCredentials:
          tokenUrl: https://auth.orbit.erdman.example/oauth/token
          scopes:
            bookings:read: Read bookings
            bookings:write: Create, change and cancel bookings
            telemetry:read: Read payload telemetry
  parameters:
    LaunchId:
      name: launchId
      in: path
      required: true
      schema:
        type: string
        pattern: ^lch_[A-Za-z0-9]{6}$
        examples:
          - lch_9Kd4Mw
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        pattern: ^bkg_[A-Za-z0-9]{6}$
        examples:
          - bkg_4Fh8Qp
    Cursor:
      name: cursor
      in: query
      description: 上一页的 `next_cursor`。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 要返回的结果数量。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrbitSignature:
      name: Orbit-Signature
      in: header
      required: true
      description: 使用您的 Webhook 密钥签名的原始请求体 HMAC-SHA256。请参阅 [Webhooks](/docs/webhooks)。
      schema:
        type: string
        examples:
          - t=1765271520,v1=5f2c9a…
  headers:
    RateLimitRemaining:
      description: 当前一分钟窗口期内剩余的请求次数。
      schema:
        type: integer
        examples:
          - 118
  responses:
    BadRequest:
      description: 请求格式错误。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: API 密钥缺失或无效。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://erdman.readme.io/docs/errors-and-rate-limits#unauthorized
            title: Missing or invalid API key
            status: 401
    NotFound:
      description: 不存在具有该 ID 的对象。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 请求过多。请等待窗口重置。
      headers:
        Retry-After:
          description: 重试前需要等待的秒数。
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LaunchStatus:
      type: string
      enum:
        - scheduled
        - go
        - hold
        - scrubbed
        - launched
      description: |
        - `scheduled`: 在舱单上，距发射超过 48 小时
        - `go`: 准予发射
        - `hold`: 倒计时暂停
        - `scrubbed`: 不会在此窗口期内发射
        - `launched`: 已离开发射台
    Vehicle:
      type: string
      enum:
        - wren
        - kestrel
        - kestrel-heavy
      description: >-
        `wren` 最多可向 LEO 运送 900 kg，`kestrel` 为 4,000 kg，`kestrel-heavy` 为 6,400
        kg。
    Orbit:
      type: string
      enum:
        - leo
        - sso
        - meo
        - geo
    Insurance:
      type: string
      enum:
        - none
        - standard
        - premium
      default: standard
    BookingStatus:
      type: string
      enum:
        - pending
        - confirmed
        - loaded
        - delivered
        - cancelled
    Launch:
      type: object
      required:
        - id
        - name
        - vehicle
        - status
        - window
        - capacity
      properties:
        id:
          type: string
          examples:
            - lch_9Kd4Mw
        name:
          type: string
          examples:
            - Polaris Run
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        status:
          $ref: '#/components/schemas/LaunchStatus'
        window:
          type: object
          properties:
            opens_at:
              type: string
              format: date-time
            closes_at:
              type: string
              format: date-time
        pad:
          type: string
          examples:
            - SLC-7E
        capacity:
          type: object
          properties:
            total_kg:
              type: integer
            available_kg:
              type: integer
        target_orbit:
          $ref: '#/components/schemas/Orbit'
        weather:
          $ref: '#/components/schemas/Weather'
    Weather:
      type: object
      properties:
        go_probability:
          type: number
          minimum: 0
          maximum: 1
          examples:
            - 0.85
        concerns:
          type: array
          items:
            type: string
            enum:
              - cumulus_clouds
              - upper_level_winds
              - lightning
              - solar_activity
    Satellite:
      type: object
      required:
        - type
        - name
        - mass_kg
        - target_orbit
      properties:
        type:
          const: satellite
        name:
          type: string
        mass_kg:
          type: number
          exclusiveMinimum: 0
        target_orbit:
          $ref: '#/components/schemas/Orbit'
        deploy_altitude_km:
          type: integer
          minimum: 160
          maximum: 36000
    BulkCargo:
      type: object
      required:
        - type
        - name
        - mass_kg
      properties:
        type:
          const: bulk_cargo
        name:
          type: string
        mass_kg:
          type: number
          exclusiveMinimum: 0
        pressurized:
          type: boolean
          default: false
        hazmat_class:
          type: string
          enum:
            - none
            - class_2
            - class_3
            - class_9
          default: none
    Payload:
      oneOf:
        - $ref: '#/components/schemas/Satellite'
        - $ref: '#/components/schemas/BulkCargo'
      discriminator:
        propertyName: type
        mapping:
          satellite: '#/components/schemas/Satellite'
          bulk_cargo: '#/components/schemas/BulkCargo'
    BookingCreate:
      type: object
      required:
        - launch_id
        - payload
      properties:
        launch_id:
          type: string
          examples:
            - lch_9Kd4Mw
        payload:
          $ref: '#/components/schemas/Payload'
        insurance:
          $ref: '#/components/schemas/Insurance'
        notify_url:
          type: string
          format: uri
          description: Orbit 为此预订发送 Webhook 的目标地址。此项将覆盖您的账户默认设置。
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 最多 20 个自定义数据的键值对。
    Booking:
      allOf:
        - $ref: '#/components/schemas/BookingCreate'
        - type: object
          required:
            - id
            - status
            - created_at
          properties:
            id:
              type: string
              examples:
                - bkg_4Fh8Qp
            status:
              $ref: '#/components/schemas/BookingStatus'
            price:
              type: object
              properties:
                amount:
                  type: integer
                  description: 以最小货币单位（分）表示的价格。
                currency:
                  type: string
                  examples:
                    - USD
            created_at:
              type: string
              format: date-time
    TelemetrySample:
      type: object
      properties:
        at:
          type: string
          format: date-time
        altitude_km:
          type: number
        velocity_mps:
          type: number
        temperature_c:
          type: number
        phase:
          type: string
          enum:
            - pad
            - ascent
            - coast
            - deploy
            - orbit
    WebhookEvent:
      type: object
      required:
        - id
        - type
        - created_at
        - data
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - booking.confirmed
            - launch.status_changed
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    Problem:
      type: object
      description: 一个 [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) 问题详情对象。
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
