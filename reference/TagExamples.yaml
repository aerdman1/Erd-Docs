openapi: 3.0.3
info:
  title: Mock Regional Trading API
  version: 1.0.0
  description: |
    Mock spec showing how custom vendor extensions can drive automatic
    region pills/tabs in ReadMe via custom JavaScript.
servers:
  - url: https://api.mocktrading.com
    description: Production
  - url: https://sandbox.mocktrading.com
    description: Sandbox
tags:
  - name: Accounts
  - name: Orders
  - name: Positions
  - name: Markets
  - name: Funding
paths:
  /v1/account:
    get:
      summary: Get Account
      operationId: getAccount
      tags:
        - Accounts
      description: Returns account details.
      x-readme-regions:
        - label: United States
          value: us
        - label: Japan
          value: jp
        - label: Canada
          value: ca
      responses:
        '200':
          description: OK
  /v1/account/config:
    get:
      summary: Get Account Config
      operationId: getAccountConfig
      tags:
        - Accounts
      description: Returns account configuration.
      x-readme-regions:
        - label: United States
          value: us
        - label: United Kingdom
          value: uk
      responses:
        '200':
          description: OK
  /v1/orders:
    get:
      summary: List Orders
      operationId: listOrders
      tags:
        - Orders
      description: Returns all orders.
      x-readme-regions:
        - label: United States
          value: us
        - label: India
          value: in
        - label: United Kingdom
          value: uk
      responses:
        '200':
          description: OK
    post:
      summary: Create Order
      operationId: createOrder
      tags:
        - Orders
      description: Creates a new order.
      x-readme-regions:
        - label: United States
          value: us
        - label: Japan
          value: jp
        - label: India
          value: in
      responses:
        '201':
          description: Created
  /v1/orders/{orderId}:
    get:
      summary: Get Order
      operationId: getOrder
      tags:
        - Orders
      description: Returns a single order.
      x-readme-regions:
        - label: United States
          value: us
        - label: Canada
          value: ca
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: Cancel Order
      operationId: cancelOrder
      tags:
        - Orders
      description: Cancels an order.
      x-readme-regions:
        - label: United States
          value: us
        - label: Japan
          value: jp
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /v1/positions:
    get:
      summary: List Positions
      operationId: listPositions
      tags:
        - Positions
      description: Returns all open positions.
      x-readme-regions:
        - label: Japan
          value: jp
        - label: India
          value: in
        - label: Canada
          value: ca
      responses:
        '200':
          description: OK
  /v1/positions/{symbol}:
    get:
      summary: Get Position
      operationId: getPosition
      tags:
        - Positions
      description: Returns one position.
      x-readme-regions:
        - label: United States
          value: us
        - label: United Kingdom
          value: uk
        - label: Canada
          value: ca
      parameters:
        - in: path
          name: symbol
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /v1/markets/clock:
    get:
      summary: Get Market Clock
      operationId: getMarketClock
      tags:
        - Markets
      description: Returns market clock status.
      x-readme-regions:
        - label: United States
          value: us
        - label: Japan
          value: jp
        - label: United Kingdom
          value: uk
      responses:
        '200':
          description: OK
  /v1/markets/calendar:
    get:
      summary: Get Market Calendar
      operationId: getMarketCalendar
      tags:
        - Markets
      description: Returns trading calendar.
      x-readme-regions:
        - label: United States
          value: us
        - label: Japan
          value: jp
        - label: India
          value: in
        - label: United Kingdom
          value: uk
        - label: Canada
          value: ca
      responses:
        '200':
          description: OK
  /v1/funding/transfers:
    post:
      summary: Create Transfer
      operationId: createTransfer
      tags:
        - Funding
      description: Initiates a transfer.
      x-readme-regions:
        - label: United States
          value: us
        - label: India
          value: in
      responses:
        '201':
          description: Created
components:
  schemas: {}
